<body>

    <h1>Мұхтар Әуезов</h1>

    <h3><i>(1897 — 1961)</i></h3>

    <hr>

    <h2>Өмірі</h2>

    <p>
        1897 жылы <b>Шыңғыстау</b> бөктерінде дүниеге келген.
        Қазақтың ұлы жазушысы, драматург, ғалым.
    </p>

    <h2>Шығармалары</h2>

    <p>
        <u>«Абай жолы»</u> — төрт томдық роман-эпопея.<br>
        Пьесалары: <i>«Еңлік-Кебек», «Қарагөз».</i>
    </p>

    <hr>

    <p>
        <font color="red"><b>1959 жылы</b></font>
        «Абай жолы» үшін Лениндік сыйлық алған.
    </p>

</body>
